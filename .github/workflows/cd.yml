name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  EB_APPLICATION_NAME: pasupathy-ai
  EB_ENVIRONMENT_NAME: pasupathy-backend

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install EB CLI
      run: |
        pip install awsebcli
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      continue-on-error: true
      id: aws-creds
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Get commit info
      id: commit
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "message=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT
        
    - name: Create deployment package
      if: steps.aws-creds.outcome == 'success'
      run: |
        zip -r deploy.zip . -x "*.git*" "node_modules/*" "pasupathy/*" ".vscode/*"
        
    - name: Deploy to Elastic Beanstalk
      if: steps.aws-creds.outcome == 'success'
      continue-on-error: true
      id: eb-deploy
      run: |
        eb init ${{ env.EB_APPLICATION_NAME }} --region ${{ env.AWS_REGION }} --platform docker
        if ! eb use ${{ env.EB_ENVIRONMENT_NAME }} 2>/dev/null; then
          echo "Environment not found. Skipping deployment."
          echo "Create the EB environment first: eb create ${{ env.EB_ENVIRONMENT_NAME }}"
          exit 1
        fi
        eb deploy --staged --timeout 10

    - name: Get deployment URL
      if: steps.aws-creds.outcome == 'success' && steps.eb-deploy.outcome == 'success'
      id: get-url
      run: |
        URL=$(eb status | grep "CNAME" | awk '{print $2}')
        echo "url=http://$URL" >> $GITHUB_OUTPUT

    - name: Health check
      if: steps.aws-creds.outcome == 'success' && steps.eb-deploy.outcome == 'success'
      run: |
        sleep 30
        URL="${{ steps.get-url.outputs.url }}"
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "000")
        if [ "$RESPONSE" = "200" ]; then
          echo "Deployment successful! Health check passed."
          echo "URL: $URL"
        else
          echo "Health check returned: $RESPONSE"
          echo "Deployment may need time to warm up."
        fi
        
    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🚀 Successfully deployed to ${{ steps.get-url.outputs.url }}"
        else
          echo "❌ Deployment failed"
        fi
        
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      id: docker-login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
      
    - name: Get version tag
      id: version
      run: |
        echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        
    - name: Build and push backend image
      if: steps.docker-login.outcome == 'success'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:${{ steps.version.outputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:${{ steps.version.outputs.date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push frontend image
      if: steps.docker-login.outcome == 'success'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:${{ steps.version.outputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:${{ steps.version.outputs.date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
