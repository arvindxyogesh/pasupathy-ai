name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  EB_APPLICATION_NAME: pasupathy-ai
  EB_ENVIRONMENT_NAME: pasupathy-ai-env

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install EB CLI
      run: |
        pip install awsebcli
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Get commit info
      id: commit
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "message=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT
        
    - name: Create deployment package
      run: |
        zip -r deploy.zip . -x "*.git*" "node_modules/*" "pasupathy/*" ".vscode/*"
        
    - name: Deploy to Elastic Beanstalk
      run: |
        eb init ${{ env.EB_APPLICATION_NAME }} --region ${{ env.AWS_REGION }} --platform docker
        eb use ${{ env.EB_ENVIRONMENT_NAME }}
        eb deploy --staged --label "v${{ steps.commit.outputs.sha_short }}" --message "${{ steps.commit.outputs.message }}"
        
    - name: Get deployment URL
      id: get-url
      run: |
        URL=$(eb status | grep "CNAME" | awk '{print $2}')
        echo "url=http://$URL" >> $GITHUB_OUTPUT
        
    - name: Health check
      run: |
        sleep 30
        URL="${{ steps.get-url.outputs.url }}"
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL/api/health || echo "000")
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Deployment successful! Health check passed."
          echo "🌐 URL: $URL"
        else
          echo "⚠️ Health check returned: $RESPONSE"
          echo "Deployment may need time to warm up."
        fi
        
    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🚀 Successfully deployed to ${{ steps.get-url.outputs.url }}"
        else
          echo "❌ Deployment failed"
        fi
        
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME != '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
      
    - name: Get version tag
      id: version
      run: |
        echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:${{ steps.version.outputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-backend:${{ steps.version.outputs.date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true
        
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:${{ steps.version.outputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/pasupathy-frontend:${{ steps.version.outputs.date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true
